<html lang="ko">
<head>

<body>
  <main class="home-shell">
    <section class="hero-panel">
      <div class="hero-kicker">사소한 일을 국가 행사처럼 처리하는 곳</div>
      <h1>쓸데없이 거대한<br><span>도구함 20선</span></h1>

        <span>전부 실제 작동</span>
        <span>도구마다 전용 연출</span>
        <span>한국어 중심</span>

    <section class="home-guide">

    </section>
    <section class="card-grid" id="toolGrid"></section>

  <div id="appMount"></div>
  <div id="fxLayer"></div>
  <button id="soundToggle" class="sound-toggle" aria-label="효과음 켜기/끄기">🔊</button>

  <script src="assets/app.js"></script>
  <script src="assets/fun-overhaul.js"></script>

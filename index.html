<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070914" />
  <title>OVERKILL UTILITIES — 기능보다 연출이 큰 도구함</title>
  <style>
    :root {
      --bg:#070914; --panel:rgba(18,22,42,.78); --line:rgba(255,255,255,.13);
      --text:#f5f7ff; --muted:#9ba4c4; --accent:#7c5cff; --accent2:#24d7ff;
      --good:#58f7aa; --warn:#ffd45c; --danger:#ff5378; --shadow:0 24px 80px rgba(0,0,0,.48);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;background:
      radial-gradient(circle at 15% -10%,rgba(124,92,255,.25),transparent 35%),
      radial-gradient(circle at 90% 20%,rgba(36,215,255,.14),transparent 30%),
      linear-gradient(180deg,#080a16 0%,#060710 100%);overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .shell{width:min(1220px,calc(100% - 32px));margin:auto;padding:48px 0 80px}
    .hero{position:relative;padding:46px;border:1px solid var(--line);border-radius:32px;background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(36,215,255,.05) 55%,rgba(255,255,255,.025));box-shadow:var(--shadow);overflow:hidden}
    .hero::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-120px;top:-220px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%);filter:blur(4px)}
    .eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid rgba(255,255,255,.15);border-radius:999px;color:#c9d1ff;background:rgba(8,10,24,.5);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:clamp(42px,7vw,88px);line-height:.92;margin:22px 0 18px;letter-spacing:-.06em;max-width:900px}
    .gradient-text{background:linear-gradient(90deg,#fff,#a894ff 42%,#5ce1ff);-webkit-background-clip:text;color:transparent}
    .hero p{max-width:700px;color:var(--muted);font-size:17px;line-height:1.7;margin:0}
    .hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.chip{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:13px;color:#d9def7}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:44px 4px 18px}.section-title h2{margin:0;font-size:26px;letter-spacing:-.03em}.section-title span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .tool-card{position:relative;min-height:190px;padding:22px;text-align:left;color:inherit;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));overflow:hidden;transition:.22s transform,.22s border-color,.22s background;box-shadow:0 12px 32px rgba(0,0,0,.18)}
    .tool-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.3);background:linear-gradient(145deg,rgba(124,92,255,.18),rgba(36,215,255,.05))}
    .tool-card::after{content:"";position:absolute;inset:auto -35px -60px auto;width:130px;height:130px;border-radius:50%;background:var(--cardglow,#7c5cff);filter:blur(50px);opacity:.28}
    .num{font-size:11px;letter-spacing:.14em;color:#828bb0}.icon{font-size:34px;margin:14px 0 22px;filter:drop-shadow(0 0 18px rgba(255,255,255,.16))}.tool-card h3{margin:0 0 8px;font-size:17px}.tool-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.launch{position:absolute;right:18px;top:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#bfc6e9}
    footer{color:#6f789b;text-align:center;font-size:12px;padding-top:38px}

    .app{position:fixed;inset:0;z-index:50;display:none;background:#070914;overflow:auto}.app.open{display:block;animation:appIn .42s ease both}@keyframes appIn{from{opacity:0;transform:scale(1.04);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
    .app-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,var(--themeGlow,rgba(124,92,255,.28)),transparent 45%),linear-gradient(180deg,#090b19,#04050c);z-index:-1}
    .app-bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);opacity:.45}
    .app-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(5,7,16,.74);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .back{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;padding:10px 14px;border-radius:12px}.app-label{font-size:12px;letter-spacing:.18em;color:#abb4da}.status-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px var(--good);display:inline-block;margin-right:8px}
    .stage{width:min(960px,calc(100% - 28px));min-height:calc(100vh - 74px);margin:auto;display:flex;flex-direction:column;justify-content:center;padding:40px 0 70px;position:relative}
    .stage-head{text-align:center;margin-bottom:28px}.stage-head .giant{font-size:clamp(48px,9vw,110px);margin-bottom:12px;filter:drop-shadow(0 0 34px var(--themeGlow,rgba(124,92,255,.5)))}.stage-head h2{font-size:clamp(30px,5vw,58px);letter-spacing:-.05em;margin:0 0 10px}.stage-head p{color:var(--muted);margin:0}
    .machine{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:var(--shadow);padding:clamp(20px,4vw,38px);position:relative;overflow:hidden}.machine::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.07) 42%,transparent 60%);transform:translateX(-120%)}.machine.processing::before{animation:sweep 1.2s infinite}@keyframes sweep{to{transform:translateX(120%)}}
    .row{display:flex;gap:12px;align-items:center}.row.wrap{flex-wrap:wrap}.stack{display:grid;gap:14px}.grow{flex:1}.field,.area,.select{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(4,7,16,.72);color:#fff;border-radius:14px;padding:14px 16px;outline:none}.field:focus,.area:focus,.select:focus{border-color:#8f7aff;box-shadow:0 0 0 4px rgba(124,92,255,.13)}.area{min-height:150px;resize:vertical}
    .primary,.secondary,.danger{border:0;border-radius:14px;padding:14px 18px;font-weight:800;color:#090b15;background:linear-gradient(135deg,#fff,#bdb4ff);box-shadow:0 10px 30px rgba(124,92,255,.22);transition:.18s transform,.18s filter}.primary:hover,.secondary:hover,.danger:hover{transform:translateY(-2px);filter:brightness(1.08)}.secondary{color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--line);box-shadow:none}.danger{background:linear-gradient(135deg,#ff8aa4,#ff3d68);color:#fff}
    .result{min-height:92px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:rgba(3,5,12,.62);padding:20px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:800;overflow-wrap:anywhere}.result small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:7px}
    .meter{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5d54ff,#36dff5,#6effad);transition:width .6s cubic-bezier(.2,.9,.2,1)}
    .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#86ffc2;background:#020805;border:1px solid rgba(88,247,170,.2);padding:16px;border-radius:14px;min-height:104px;white-space:pre-wrap;font-size:12px;line-height:1.7}
    .flash{position:fixed;inset:0;background:white;pointer-events:none;opacity:0;z-index:100}.flash.go{animation:flash .65s ease}@keyframes flash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
    .shake{animation:shake .55s linear}@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,2px) rotate(-.4deg)}40%{transform:translate(6px,-3px) rotate(.5deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
    .particle{position:fixed;width:8px;height:8px;border-radius:2px;z-index:110;pointer-events:none;animation:particle 1s ease-out forwards}@keyframes particle{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
    .big-number{font-size:clamp(58px,12vw,140px);line-height:1;font-weight:950;letter-spacing:-.08em;text-shadow:0 0 40px rgba(124,92,255,.55)}
    .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hud>div{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);text-align:center}.hud b{display:block;font-size:20px}.hud span{font-size:11px;color:var(--muted)}
    .todo-item{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.04)}.todo-item.done{opacity:.5;text-decoration:line-through}.todo-item button{margin-left:auto}
    .arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}.fighter{text-align:center;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.04)}.fighter .emoji{font-size:72px}.vs{font-size:30px;font-weight:950;color:#ff5f80}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice-grid button{font-size:38px;padding:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;color:#fff}.choice-grid button:hover{background:rgba(124,92,255,.22)}
    .qr-wrap{display:grid;place-items:center;background:#fff;border-radius:18px;padding:18px;width:max-content;max-width:100%;margin:auto}.qr-wrap canvas{max-width:100%;height:auto}
    .dial{width:210px;height:210px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(#7c5cff var(--vol,40%),rgba(255,255,255,.08) 0);box-shadow:0 0 70px rgba(124,92,255,.4)}.dial::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#0a0d1b}.dial b{position:relative;font-size:42px}
    .countdown{text-align:center;font-size:clamp(68px,14vw,150px);font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.08em}.warning{color:#ff5879;text-shadow:0 0 35px rgba(255,83,120,.5)}
    .canvas-box{display:grid;place-items:center;border:1px dashed rgba(255,255,255,.2);border-radius:18px;min-height:220px;overflow:hidden}.canvas-box img,.canvas-box canvas{max-width:100%;max-height:420px}
    .stars{font-size:44px;letter-spacing:8px;color:#ffd65a;text-shadow:0 0 22px rgba(255,214,90,.45)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:34px}.arena{grid-template-columns:1fr}.vs{transform:rotate(90deg)}.hud{grid-template-columns:1fr}}
    @media(max-width:560px){.shell{width:min(100% - 20px,1220px);padding-top:18px}.hero{padding:26px;border-radius:24px}.grid{grid-template-columns:1fr}.tool-card{min-height:160px}.row{align-items:stretch;flex-direction:column}.choice-grid{grid-template-columns:repeat(3,1fr)}.app-label{display:none}.stage{padding-top:25px}.machine{border-radius:22px}}
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <div class="flash" id="flash"></div>
  <main class="shell" id="home">
    <section class="hero">
      <span class="eyebrow">⚠ Productivity Theater Division</span>
      <h1><span class="gradient-text">OVERKILL</span><br>UTILITIES</h1>
      <p>하는 일은 사소합니다. 연출은 국가 비상사태 수준입니다. 아래 20개 도구는 실제로 작동하며, 클릭 한 번을 위해 GPU가 존재 이유를 고민하게 만듭니다.</p>
      <div class="hero-meta"><span class="chip">20개 미니 앱</span><span class="chip">설치 없음</span><span class="chip">쓸데없는 진지함 100%</span></div>
    </section>
    <div class="section-title"><h2>도구 선택</h2><span>누르면 전체 화면으로 실행</span></div>
    <section class="grid" id="toolGrid"></section>
    <footer>OVERKILL UTILITIES · 실용성 40% · 연출 960%</footer>
  </main>
  <div id="apps"></div>

<script>
const tools=[
 {id:'weather',icon:'🌦️',title:'천지개벽 날씨국',desc:'서울의 현재 날씨를 우주적 사건으로 보고합니다.',color:'#2dd9ff'},
 {id:'button',icon:'🔘',title:'궁극의 확인 버튼',desc:'확인 한 번에 필살기, 충격파, 국가 승인.',color:'#ff4d8d'},
 {id:'todo',icon:'⚔️',title:'마왕 토벌 투두',desc:'할 일을 끝낼 때마다 보스 체력이 깎입니다.',color:'#ff7757'},
 {id:'timer',icon:'☢️',title:'종말 집중 타이머',desc:'집중 시간이 끝나면 과도한 경보가 울립니다.',color:'#ffcf4d'},
 {id:'password',icon:'💻',title:'영화식 비밀번호 생성',desc:'서버 48개를 해킹한 척하며 문자열 하나 생성.',color:'#58f7aa'},
 {id:'dice',icon:'🎲',title:'우주 창조 주사위',desc:'1부터 6까지 정하는 데 은하 하나를 소비합니다.',color:'#b67cff'},
 {id:'rps',icon:'✊',title:'세계대전 가위바위보',desc:'손동작 셋을 전략 병기로 취급합니다.',color:'#ff5b65'},
 {id:'currency',icon:'📉',title:'금융위기 환율 계산',desc:'환전 한 번마다 시장이 붕괴하는 척합니다.',color:'#55dc9e'},
 {id:'counter',icon:'🔎',title:'문서 심문실',desc:'글자 수를 세기 위해 문장을 취조합니다.',color:'#6ca8ff'},
 {id:'lunch',icon:'🍲',title:'점심 신탁소',desc:'성스러운 의식 끝에 김치찌개를 내려줍니다.',color:'#ff9d4d'},
 {id:'qr',icon:'▦',title:'레이저 QR 제조소',desc:'평범한 QR을 극비 장치처럼 조립합니다.',color:'#60efff'},
 {id:'nickname',icon:'🧬',title:'닉네임 각성 연구소',desc:'DNA와 평행우주를 분석한 척 이름을 만듭니다.',color:'#d870ff'},
 {id:'spell',icon:'⚖️',title:'맞춤법 대법원',desc:'흔한 오타를 법정에 세워 유죄 판결합니다.',color:'#ffbf55'},
 {id:'download',icon:'🚀',title:'파일 발사 통제소',desc:'작은 TXT 파일 하나를 궤도에 올립니다.',color:'#fc6f58'},
 {id:'random',icon:'🎰',title:'극비 난수 작전',desc:'숫자 하나를 위성 추적 끝에 공개합니다.',color:'#fd5dce'},
 {id:'quiz',icon:'🐉',title:'산수 던전',desc:'초등 산수 정답으로 드래곤을 공격합니다.',color:'#7fe05d'},
 {id:'compress',icon:'🗜️',title:'이미지 압축 프레스',desc:'사진을 산업용 기계로 짓누르는 척 압축합니다.',color:'#8b9cff'},
 {id:'compat',icon:'🔮',title:'우주 궁합 판독기',desc:'이름 두 개로 운명을 과학적으로 날조합니다.',color:'#ff76ad'},
 {id:'volume',icon:'🔊',title:'스타디움 볼륨 콘솔',desc:'볼륨 1 올릴 때마다 공연장이 폭발합니다.',color:'#6ee6c8'},
 {id:'refresh',icon:'🌀',title:'시간여행 새로고침',desc:'페이지 갱신을 시공간 붕괴로 포장합니다.',color:'#756dff'}
];
const grid=document.getElementById('toolGrid');
grid.innerHTML=tools.map((t,i)=>`<button class="tool-card" style="--cardglow:${t.color}" onclick="openApp('${t.id}')"><span class="launch">↗</span><span class="num">SYSTEM ${String(i+1).padStart(2,'0')}</span><div class="icon">${t.icon}</div><h3>${t.title}</h3><p>${t.desc}</p></button>`).join('');

const body=(id,title,icon,content,color='#7c5cff')=>`<section class="app" id="app-${id}" style="--themeGlow:${hexToRgba(color,.3)}"><div class="app-bg"></div><header class="app-top"><button class="back" onclick="closeApp('${id}')">← 도구함</button><span class="app-label"><i class="status-dot"></i>${title.toUpperCase()}</span><span>${icon}</span></header><main class="stage"><div class="stage-head"><div class="giant">${icon}</div><h2>${title}</h2></div>${content}</main></section>`;
function hexToRgba(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function openApp(id){document.getElementById('app-'+id).classList.add('open');document.body.style.overflow='hidden';history.pushState({app:id},'',`#${id}`)}
function closeApp(id,historyBack=true){document.getElementById('app-'+id)?.classList.remove('open');document.body.style.overflow='';if(historyBack&&location.hash)history.pushState({},'',location.pathname+location.search)}
window.addEventListener('popstate',()=>{document.querySelectorAll('.app.open').forEach(x=>x.classList.remove('open'));document.body.style.overflow='';const id=location.hash.slice(1);if(id&&document.getElementById('app-'+id)){document.getElementById('app-'+id).classList.add('open');document.body.style.overflow='hidden'}});
function fx(power=24,color='#7c5cff'){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');for(let i=0;i<power;i++){const p=document.createElement('i');p.className='particle';p.style.left='50vw';p.style.top='50vh';p.style.background=i%2?color:'#fff';p.style.setProperty('--x',(Math.random()*600-300)+'px');p.style.setProperty('--y',(Math.random()*500-250)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),1100)}}
function setProcess(el,on=true){el.classList.toggle('processing',on)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

const apps=document.getElementById('apps');
apps.innerHTML=[
body('weather','천지개벽 날씨국','🌦️',`<div class="machine stack" id="weatherMachine"><p style="text-align:center;color:var(--muted)">서울 좌표를 기상 위성에 강제 연결합니다.</p><div class="hud"><div><b id="wTemp">--°</b><span>기온</span></div><div><b id="wWind">--</b><span>풍속 km/h</span></div><div><b id="wCode">대기 중</b><span>하늘 상태</span></div></div><button class="primary" onclick="weatherNow()">위성 강제 동기화</button><div class="log" id="wLog">[SYSTEM] 기상 통제권 대기 중...</div></div>`,'#2dd9ff'),
body('button','궁극의 확인 버튼','🔘',`<div class="machine stack" id="buttonMachine"><div class="result" id="buttonResult">확인할 내용을 입력하십시오.<small>별 의미는 없어도 됩니다. 시스템은 진지합니다.</small></div><input class="field" id="confirmText" placeholder="예: 진짜 저장할까요?" value="이 설정을 저장하시겠습니까?"><button class="danger" style="font-size:22px;padding:22px" onclick="ultimateConfirm()">최종 승인 개시</button></div>`,'#ff4d8d'),
body('todo','마왕 토벌 투두','⚔️',`<div class="machine stack"><div class="hud"><div><b id="bossHp">100%</b><span>마왕 체력</span></div><div><b id="todoDone">0</b><span>처치한 임무</span></div><div><b id="todoRank">F</b><span>용사 등급</span></div></div><div class="meter"><i id="bossBar" style="width:100%"></i></div><div class="row"><input class="field grow" id="todoInput" placeholder="예: 설거지"><button class="primary" onclick="addTodo()">퀘스트 등록</button></div><div class="stack" id="todoList"></div></div>`,'#ff7757'),

async function weatherNow(){const m=document.getElementById('weatherMachine'),log=document.getElementById('wLog');setProcess(m,true);log.textContent='[UPLINK] 서울 상공 위성 접속...\n[SCAN] 구름 입자에 행정명령 전달...';try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,wind_speed_10m,weather_code&timezone=Asia%2FSeoul');const d=await r.json();const c=d.current;const names={0:'완전 맑음',1:'대체로 맑음',2:'부분 흐림',3:'흐림',45:'안개',48:'서리 안개',51:'약한 이슬비',53:'이슬비',55:'강한 이슬비',61:'약한 비',63:'비',65:'강한 비',71:'약한 눈',73:'눈',75:'강한 눈',80:'소나기',95:'뇌우'};document.getElementById('wTemp').textContent=c.temperature_2m+'°';document.getElementById('wWind').textContent=c.wind_speed_10m;document.getElementById('wCode').textContent=names[c.weather_code]||'기상 현상';log.textContent=`[SUCCESS] 대기권 판독 완료.\n[NOTICE] ${names[c.weather_code]||'알 수 없는 현상'}을(를) 세계 멸망이 아닌 일상 날씨로 분류.`;fx(18,'#2dd9ff')}catch(e){log.textContent='[OFFLINE] 위성 연결 실패. 인터넷 연결을 확인하십시오.'}setProcess(m,false)}
async function ultimateConfirm(){const m=document.getElementById('buttonMachine'),r=document.getElementById('buttonResult'),text=document.getElementById('confirmText').value||'확인';setProcess(m,true);r.innerHTML='승인 체계 7단계 가동 중...';await sleep(700);r.innerHTML='생체 신호 대조 완료...';await sleep(650);r.innerHTML='국제 승인 위원회 결재 중...';await sleep(650);fx(42,'#ff4d8d');r.innerHTML=`승인 완료: ${escapeHtml(text)}<small>결국 버튼 한 번 눌렀습니다.</small>`;setProcess(m,false)}
let todos=[],doneCount=0;function addTodo(){const i=document.getElementById('todoInput');if(!i.value.trim())return;todos.push({text:i.value.trim(),done:false});i.value='';renderTodos()}function renderTodos(){document.getElementById('todoList').innerHTML=todos.map((t,i)=>`<div class="todo-item ${t.done?'done':''}"><span>${t.done?'💥':'🛡️'}</span><b>${escapeHtml(t.text)}</b><button class="secondary" onclick="completeTodo(${i})">${t.done?'완료':'공격'}</button></div>`).join('')||'<div class="result"><small>퀘스트를 등록하면 마왕이 매우 곤란해집니다.</small></div>'}function completeTodo(i){if(todos[i].done)return;todos[i].done=true;doneCount++;const hp=Math.max(0,100-doneCount*20);document.getElementById('bossHp').textContent=hp+'%';document.getElementById('bossBar').style.width=hp+'%';document.getElementById('todoDone').textContent=doneCount;document.getElementById('todoRank').textContent=['F','E','D','C','B','S'][Math.min(doneCount,5)];fx(30,'#ff7757');renderTodos()}
let timerInt,timerRemain=1500;function updateTimer(){const m=Math.floor(timerRemain/60),s=timerRemain%60;const el=document.getElementById('timerDisplay');el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warning',timerRemain<=10)}function startTimer(){clearInterval(timerInt);timerRemain=Math.max(1,Number(document.getElementById('timerMin').value)||25)*60;updateTimer();document.getElementById('timerLog').textContent='[ARMED] 집중 프로토콜 활성화. 딴짓 감지 장치는 사실 없습니다.';timerInt=setInterval(()=>{timerRemain--;updateTimer();if(timerRemain<=0){clearInterval(timerInt);document.getElementById('timerLog').textContent='[COMPLETE] 집중 임무 종료. 문명은 유지되었습니다.';fx(60,'#ffcf4d')}},1000)}function resetTimer(){clearInterval(timerInt);timerRemain=(Number(document.getElementById('timerMin').value)||25)*60;updateTimer();document.getElementById('timerLog').textContent='[SAFE] 카운트다운 해제.'}
async function generatePassword(){const m=document.getElementById('pwMachine'),log=document.getElementById('pwLog');setProcess(m,true);const lines=['routing through 14 fictional proxies...','decrypting nothing in particular...','bypassing dramatic firewall...','extracting entropy from keyboard dust...','ACCESS GRANTED'];for(const l of lines){log.textContent+='\n> '+l;await sleep(280)}const len=Math.max(8,Math.min(64,+document.getElementById('pwLen').value||18));let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';if(document.getElementById('pwSymbols').checked)chars+='!@#$%^&*_-+=';const arr=new Uint32Array(len);crypto.getRandomValues(arr);const pw=[...arr].map(n=>chars[n%chars.length]).join('');document.getElementById('pwResult').textContent=pw;fx(24,'#58f7aa');setProcess(m,false)}
async function rollDice(){const m=document.getElementById('diceMachine'),r=document.getElementById('diceResult'),l=document.getElementById('diceLog');setProcess(m,true);for(let i=0;i<14;i++){r.textContent=1+Math.floor(Math.random()*6);await sleep(55+i*5)}const n=1+Math.floor(Math.random()*6);r.textContent=n;l.textContent=`[BIG BANG] 우주 상수 ${n} 확정.\n[STABILITY] 은하 충돌 0건. 주사위 결과 정상.`;fx(28,'#b67cff');setProcess(m,false)}
function rps(p){const a=['✌️','✊','🖐️'],c=a[Math.floor(Math.random()*3)];document.getElementById('playerRps').textContent=p;document.getElementById('cpuRps').textContent=c;const win=(p==='✌️'&&c==='🖐️')||(p==='✊'&&c==='✌️')||(p==='🖐️'&&c==='✊');const text=p===c?'휴전 협정 체결: 무승부':win?'플레이어 연합군 승리':'AI 사령부 승리';document.getElementById('rpsResult').textContent=text;fx(win?34:18,win?'#58f7aa':'#ff5b65')}
async function convertCurrency(){const m=document.getElementById('currencyMachine'),amount=+document.getElementById('curAmount').value,from=document.getElementById('curFrom').value,to=document.getElementById('curTo').value,r=document.getElementById('curResult'),l=document.getElementById('curLog');if(!Number.isFinite(amount))return;setProcess(m,true);l.textContent='[ALERT] 대규모 주문 감지.\n[TRADERS] 가상의 거래원 700명이 동시에 소리치는 중...';try{if(from===to){r.textContent=`${amount.toLocaleString()} ${to}`;}else{const res=await fetch(`https://api.frankfurter.dev/v2/rate/${from}/${to}`);const d=await res.json();const rate=Number(d.rate);r.innerHTML=`${(amount*rate).toLocaleString(undefined,{maximumFractionDigits:2})} ${to}<small>1 ${from} = ${rate} ${to}</small>`}await sleep(600);l.textContent+='\n[RECOVERY] 시장은 놀랍게도 멀쩡합니다.';fx(30,'#55dc9e')}catch(e){r.innerHTML='환율 서버 연결 실패<small>네트워크 상태를 확인하십시오.</small>';l.textContent='[HALT] 거래 중지.'}setProcess(m,false)}
function countText(){const t=document.getElementById('countText').value,a=t.length,n=t.replace(/\s/g,'').length,w=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById('charAll').textContent=a;document.getElementById('charNoSpace').textContent=n;document.getElementById('wordCount').textContent=w;document.getElementById('countLog').textContent=`[EVIDENCE] 문자 ${a}개 확보.\n[STATEMENT] 공백 ${a-n}개는 묵비권을 행사함.\n[VERDICT] 단어 ${w}개로 구성된 문서.`}
const lunches=['김치찌개','제육볶음','돈까스','마라탕','쌀국수','초밥','국밥','냉면','떡볶이','햄버거','파스타','카레','치킨','비빔밥'];async function oracleLunch(){const m=document.getElementById('lunchMachine'),r=document.getElementById('lunchResult'),s=document.getElementById('lunchStars');setProcess(m,true);for(let i=0;i<18;i++){r.textContent=lunches[Math.floor(Math.random()*lunches.length)];s.style.transform=`rotate(${i*19}deg) scale(${1+Math.sin(i)*.15})`;await sleep(80)}r.textContent=lunches[Math.floor(Math.random()*lunches.length)];s.style.transform='none';fx(38,'#ff9d4d');setProcess(m,false)}
function makeQR(){
  const text=document.getElementById('qrText').value||' ';
  const out=document.getElementById('qrOutput');
  out.innerHTML='';
  if(window.QRCode){
    new QRCode(out,{text,width:240,height:240,colorDark:'#05060a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    document.getElementById('qrLog').textContent='[COMPLETE] 스캔 가능한 QR 각인 완료.\n[VERIFY] 오류 정정 레벨 H 적용.';
  }else{
    const c=document.createElement('canvas');c.width=c.height=240;out.appendChild(c);
    const ctx=c.getContext('2d'),size=29,cell=c.width/size;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    let seed=2166136261;for(const ch of text){seed^=ch.charCodeAt(0);seed=Math.imul(seed,16777619)}
    const rand=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};ctx.fillStyle='#05060a';
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(rand()>.52)ctx.fillRect(Math.floor(x*cell),Math.floor(y*cell),Math.ceil(cell),Math.ceil(cell));
    const finder=(x,y)=>{ctx.fillStyle='#05060a';ctx.fillRect(x*cell,y*cell,7*cell,7*cell);ctx.fillStyle='#fff';ctx.fillRect((x+1)*cell,(y+1)*cell,5*cell,5*cell);ctx.fillStyle='#05060a';ctx.fillRect((x+2)*cell,(y+2)*cell,3*cell,3*cell)};finder(1,1);finder(size-8,1);finder(1,size-8);
    document.getElementById('qrLog').textContent='[OFFLINE] QR 라이브러리를 불러오지 못해 연출용 패턴으로 대체했습니다.';
  }
  fx(22,'#60efff');
}
const nickParts={cyber:['Neo','Zero','Byte','Nexus','Chrome','404'],fantasy:['루나','아르카','벨','엘리온','세라프','드라코'],cute:['말랑','몽글','콩','토리','뽀짝','젤리'],dark:['Noir','Abyss','Void','Grim','Raven','Ash']};async function generateNick(){const m=document.getElementById('nickMachine'),seed=document.getElementById('nickSeed').value.trim()||'별',style=document.getElementById('nickStyle').value,r=document.getElementById('nickResult'),bar=document.getElementById('nickMeter');setProcess(m,true);for(const p of [18,42,71,100]){bar.style.width=p+'%';r.textContent=`유전자 배열 ${p}%`;await sleep(330)}const part=nickParts[style][Math.floor(Math.random()*nickParts[style].length)],num=Math.floor(Math.random()*999);r.textContent=Math.random()>.5?`${part}${seed}${num}`:`${seed}_${part}${num}`;fx(30,'#d870ff');setProcess(m,false)}
function judgeSpell(){let t=document.getElementById('spellText').value;const rules=[['됬','됐'],['몇일','며칠'],['않 했','안 했'],['왠지','왠지'],['어떻해','어떻게'],['금새','금세']];let cases=[];for(const [bad,good] of rules){if(bad==='왠지')continue;if(t.includes(bad)){cases.push(`${bad} → ${good}`);t=t.split(bad).join(good)}}const r=document.getElementById('spellResult'),l=document.getElementById('spellLog');if(cases.length){r.innerHTML=`유죄 ${cases.length}건<small>${escapeHtml(t)}</small>`;l.textContent='[VERDICT]\n'+cases.map((x,i)=>`${i+1}. ${x} : 교정 명령`).join('\n');fx(26,'#ffbf55')}else{r.innerHTML='무죄<small>내장된 기본 오타 목록에서 위반 사항을 찾지 못했습니다.</small>';l.textContent='[COURT] 사건 종결. 전문 맞춤법 API가 아니라 기본 규칙 검사입니다.'}}
async function launchDownload(){const m=document.getElementById('downloadMachine'),l=document.getElementById('downloadLog');setProcess(m,true);for(const line of ['연료 주입 20%','궤도 계산 완료','발사대 분리','3... 2... 1...']){l.textContent+='\n[LAUNCH] '+line;await sleep(420)}fx(50,'#fc6f58');const blob=new Blob([document.getElementById('fileContent').value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=document.getElementById('fileName').value||'file.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);l.textContent+='\n[ORBIT] 파일 전송 완료. 로켓은 필요 없었습니다.';setProcess(m,false)}
async function randomOperation(){const m=document.getElementById('randomMachine'),r=document.getElementById('randResult'),l=document.getElementById('randLog');let min=Math.ceil(+document.getElementById('randMin').value),max=Math.floor(+document.getElementById('randMax').value);if(min>max)[min,max]=[max,min];setProcess(m,true);const lines=['위성 1호 좌표 고정','암호화 통신 개시','난수 구름 포착','최종 목표 승인'];for(const x of lines){l.textContent+='\n[SAT] '+x;for(let j=0;j<4;j++){r.textContent=Math.floor(Math.random()*(max-min+1))+min;await sleep(70)}}const n=Math.floor(Math.random()*(max-min+1))+min;r.textContent=n;fx(32,'#fd5dce');setProcess(m,false)}
let quiz={answer:0,hp:100,combo:0,lv:1};function newQuiz(){const max=10+quiz.lv*5,a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*max),ops=quiz.lv>2?['+','-','×']:['+','-'],op=ops[Math.floor(Math.random()*ops.length)];quiz.answer=op==='+'?a+b:op==='-'?a-b:a*b;document.getElementById('quizQuestion').textContent=`${a} ${op} ${b} = ?`;document.getElementById('quizAnswer').value=''}function answerQuiz(){const val=+document.getElementById('quizAnswer').value;if(val===quiz.answer){quiz.combo++;const dmg=15+Math.min(20,quiz.combo*2);quiz.hp=Math.max(0,quiz.hp-dmg);fx(28,'#7fe05d');if(quiz.hp===0){quiz.lv++;quiz.hp=100;quiz.combo=0;document.getElementById('quizQuestion').innerHTML=`드래곤 격파! <small>더 강한 산수가 나타납니다.</small>`;setTimeout(newQuiz,900)}else newQuiz()}else{quiz.combo=0;document.getElementById('quizQuestion').innerHTML=`공격 빗나감. 정답은 ${quiz.answer}<small>드래곤이 산수를 비웃고 있습니다.</small>`;setTimeout(newQuiz,1100)}document.getElementById('dragonHp').textContent=quiz.hp;document.getElementById('dragonBar').style.width=quiz.hp+'%';document.getElementById('quizCombo').textContent=quiz.combo;document.getElementById('quizLv').textContent=quiz.lv}
function compressImage(){const file=document.getElementById('imageInput').files[0];if(!file)return;const m=document.getElementById('compressMachine'),preview=document.getElementById('imagePreview'),result=document.getElementById('compressResult'),btn=document.getElementById('compressedDownload');setProcess(m,true);const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{const url=URL.createObjectURL(blob);preview.innerHTML=`<img src="${url}" alt="압축 미리보기">`;result.innerHTML=`${(blob.size/1024).toFixed(1)} KB<small>원본 ${(file.size/1024).toFixed(1)} KB · ${Math.max(0,100-blob.size/file.size*100).toFixed(1)}% 감소</small>`;btn.disabled=false;btn.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='compressed-'+file.name.replace(/\.[^.]+$/,'.jpg');a.click()};setProcess(m,false);fx(24,'#8b9cff')},'image/jpeg',+document.getElementById('quality').value)};img.src=URL.createObjectURL(file)}
async function compatibility(){const a=document.getElementById('nameA').value.trim(),b=document.getElementById('nameB').value.trim();if(!a||!b)return;const m=document.getElementById('compatMachine'),r=document.getElementById('compatResult'),t=document.getElementById('compatText');setProcess(m,true);let h=0;for(const ch of [...a,...b])h=(h*31+ch.charCodeAt(0))>>>0;for(let i=0;i<18;i++){r.textContent=Math.floor(Math.random()*101)+'%';t.textContent=['별자리 대조','DNA 파형 분석','평행우주 표본 수집','운명 계수 계산'][i%4];await sleep(85)}const score=35+(h%66);r.textContent=score+'%';t.textContent=score>80?'우주가 노골적으로 밀어주는 조합':score>60?'충분히 안정적인 파동':'서로 다른 시간선의 개성 강한 조합';fx(34,'#ff76ad');setProcess(m,false)}
let lastVol=40;function setVolume(v){v=+v;document.getElementById('volumeText').textContent=v;document.getElementById('volumeDial').style.setProperty('--vol',v+'%');document.getElementById('crowdLevel').textContent=Math.round(8000+v*241).toLocaleString();document.getElementById('speakerTemp').textContent=Math.round(26+v*.42)+'°';document.getElementById('decibel').textContent=Math.round(35+v*.92)+' dB';if(Math.abs(v-lastVol)>=8){fx(12,'#6ee6c8');lastVol=v}}
async function timeTravel(){const m=document.getElementById('refreshMachine'),l=document.getElementById('refreshLog'),t=document.getElementById('timeline');setProcess(m,true);const lines=['인과율 잠금','과거 캐시 제거','미래 DOM 예측','시간축 접기','현재 재구성'];for(let i=0;i<lines.length;i++){l.textContent+='\n[CHRONO] '+lines[i];t.textContent=`시간선 붕괴 ${Math.round((i+1)/lines.length*100)}%`;await sleep(430)}fx(54,'#756dff');t.textContent='현재 시간선: PRIME-'+String(1+Math.floor(Math.random()*99)).padStart(2,'0');l.textContent+='\n[SUCCESS] 새 시간선 도착. 페이지는 그대로입니다.';setProcess(m,false)}
function copyText(id){const t=document.getElementById(id).textContent;navigator.clipboard?.writeText(t);fx(12,'#58f7aa')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
renderTodos();updateTimer();newQuiz();makeQR();
